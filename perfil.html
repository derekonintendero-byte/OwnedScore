<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil – OwnedScore</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #05060a;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #4fd1ff;
    }

    .nav-btn {
      background: #4fd1ff;
      color: #05060a;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .profile-box {
      background: #0b0d13;
      padding: 1.5rem;
      border-radius: 1rem;
      border: 1px solid #1b1f2b;
      margin-bottom: 2rem;
    }

    .profile-item {
      margin-bottom: 0.8rem;
    }

    .reviews-box {
      background: #0b0d13;
      padding: 1.5rem;
      border-radius: 1rem;
      border: 1px solid #1b1f2b;
    }

    .review-card {
      background: #11131b;
      padding: 1rem;
      border-radius: 0.8rem;
      border: 1px solid #22263a;
      margin-bottom: 1rem;
    }

    .logout-btn {
      background: #ff4f4f;
      color: #05060a;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Mi Perfil</h1>

    <!-- Botón para volver al inicio -->
    <button class="nav-btn" id="backBtn">Volver al inicio</button>

    <div class="profile-box">
      <h2>Información del usuario</h2>
      <div class="profile-item"><strong>Email:</strong> <span id="userEmail"></span></div>
      <div class="profile-item"><strong>ID de usuario:</strong> <span id="userId"></span></div>

      <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="reviews-box">
      <h2>Mis reseñas</h2>
      <div id="reviewsContainer">
        <p>No has escrito reseñas todavía.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const userEmail = document.getElementById("userEmail");
    const userId = document.getElementById("userId");
    const logoutBtn = document.getElementById("logoutBtn");
    const backBtn = document.getElementById("backBtn");

    // Proteger la página: si no hay sesión → volver al inicio
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmail.textContent = user.email;
        userId.textContent = user.uid;
      } else {
        window.location.href = "index.html";
      }
    });

    // Cerrar sesión
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "index.html";
    });

    // Volver al inicio
    backBtn.addEventListener("click", () => {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
