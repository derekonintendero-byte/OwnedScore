<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ranking - OwnedScore</title>
  <style>
    body{font-family:system-ui,Arial;background:#05060a;color:#f5f5f5;margin:0;padding:1rem}
    table{width:100%;border-collapse:collapse}
    th,td{padding:0.6rem;border-bottom:1px solid #222;text-align:left}
    th{color:#aaa}
    .btn{display:inline-block;padding:0.4rem 0.6rem;border-radius:6px;background:#4fd1ff;color:#000;text-decoration:none;font-weight:600}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .no-result{background:#11131b;padding:1rem;border-radius:8px;border:1px solid #222}
  </style>
</head>
<body>
  <header>
    <h1>Ranking</h1>
    <div>
      <a class="btn" href="./">Inicio</a>
      <a class="btn" href="games.html">Juegos</a>
    </div>
  </header>

  <div id="content">Cargando ranking...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚠️ Usa tu configuración real de Firebase (la misma que en index.html)
    const firebaseConfig = {
      apiKey: "AIzaSyBS7zyyoSvQfllyQ8RAvdT3zU0GQGh5qUg",
      authDomain: "ownedscore.firebaseapp.com",
      projectId: "ownedscore",
      storageBucket: "ownedscore.firebasestorage.app",
      messagingSenderId: "987565706441",
      appId: "1:987565706441:web:988b9f831c19133a8c1118"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadRanking(){
      try{
        const col = collection(db, 'scores');
        const snaps = await getDocs(col);
        const arr = [];
        snaps.forEach(s => { const d = s.data(); arr.push({ name: s.id, total: d.total || 0, votes: d.votes || 0, avg: Math.round((d.total||0)/Math.max(1,(d.votes||0))) }); });
        arr.sort((a,b)=> b.avg - a.avg);
        if(arr.length===0) { document.getElementById('content').innerHTML = '<div class="no-result">Aún no hay puntuaciones.</div>'; return; }

        const rows = arr.map((r,i)=> `<tr><td>${i+1}</td><td><a style="color:#4fd1ff;text-decoration:none" href="games.html?slug=${encodeURIComponent(r.name)}">${r.name}</a></td><td>${r.avg}</td><td>${r.votes}</td></tr>`).join('');
        document.getElementById('content').innerHTML = `<table><thead><tr><th>#</th><th>Juego</th><th>Puntuación</th><th>Votos</th></tr></thead><tbody>${rows}</tbody></table>`;
      }catch(err){
        console.error(err);
        document.getElementById('content').innerHTML = '<div class="no-result">Error cargando ranking.</div>';
      }
    }

    loadRanking();
  </script>
</body>
</html>
